# Configuracion para TESTS: base H2 en memoria.
# Este archivo reemplaza a src/main/resources/application.properties cuando se corre mvn test,
# asi los tests funcionan en cualquier PC sin instalar PostgreSQL.

spring.datasource.url=jdbc:h2:mem:recursos_humanos;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop: crea las tablas al iniciar y las borra al terminar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
